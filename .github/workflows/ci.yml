name: Credit Risk MLOps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn joblib fastapi uvicorn evidently==0.4.30

      - name: Run retraining
        run: |
          python src/retrain.py

      - name: Build Docker image
        run: |
          docker build -t credit-risk-api .

      - name: Verify API code
        run: |
          python -m compileall api src monitoring